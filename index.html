<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EIR Data Management Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwIJ2cn1FmdTxethpTHCT0sDsaF6kHYveSY3X0duJrSTBAnvDAwTgmBcymrmOAOKksT/exec";
        const CORRECT_PIN = "1234"; // Change this to your preferred security PIN

        function App() {
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            const [enteredPin, setEnteredPin] = React.useState("");
            const [pinError, setPinError] = React.useState(false);

            const [message, setMessage] = React.useState("");
            const [status, setStatus] = React.useState("");
            const [rows, setRows] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [viewMode, setViewMode] = React.useState("table"); // "table" or "json"

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (enteredPin === CORRECT_PIN) {
                    setIsAuthenticated(true);
                    setPinError(false);
                } else {
                    setPinError(true);
                    setEnteredPin("");
                }
            };

            const fetchSheetData = async () => {
                setLoading(true);
                try {
                    const response = await fetch(WEB_APP_URL);
                    const data = await response.json();
                    setRows(data);
                } catch (err) {
                    console.error("Error fetching data", err);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                if (isAuthenticated) {
                    fetchSheetData();
                }
            }, [isAuthenticated]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setStatus("Saving to EIR Data...");
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    setStatus("Saved successfully!");
                    setMessage("");
                    setTimeout(() => {
                        setStatus("");
                        fetchSheetData();
                    }, 1500);
                } catch (err) {
                    setStatus("Error saving data.");
                }
            };

            if (!isAuthenticated) {
                return (
                    <div class="min-h-screen flex items-center justify-center px-4">
                        <div class="max-w-md w-full bg-white shadow-md rounded-lg p-8 border border-gray-100 text-center">
                            <h2 class="text-2xl font-bold text-blue-600 mb-2">Restricted Access</h2>
                            <p class="text-sm text-gray-500 mb-6">Please enter your security PIN to view the EIR Dashboard.</p>
                            
                            <form onSubmit={handlePinSubmit} class="space-y-4">
                                <input 
                                    type="password" 
                                    maxLength="6"
                                    value={enteredPin} 
                                    onChange={(e) => setEnteredPin(e.target.value)} 
                                    placeholder="Enter PIN..." 
                                    required 
                                    class="w-full text-center tracking-widest text-lg px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition-colors shadow-sm">
                                    Unlock Dashboard
                                </button>
                            </form>
                            {pinError && <p class="mt-3 text-sm font-semibold text-red-600">Incorrect PIN. Please try again.</p>}
                        </div>
                    </div>
                );
            }

            const headers = rows.length > 0 ? rows[0] : [];
            const dataRows = rows.length > 1 ? rows.slice(1) : [];

            return (
                <div class="max-w-5xl mx-auto px-4 py-10">
                    <div class="bg-white shadow-md rounded-lg p-6 mb-8 border border-gray-100">
                        <div class="flex justify-between items-center mb-1">
                            <h2 class="text-2xl font-bold text-blue-600">EIR Data Management Dashboard</h2>
                            <button onClick={() => setIsAuthenticated(false)} class="text-xs text-gray-500 hover:text-red-600 border px-2 py-1 rounded">Lock</button>
                        </div>
                        <p class="text-sm text-gray-500 mb-6">Live sync with Google Sheet tab: <span class="font-semibold text-gray-700">eir_data</span></p>

                        <form onSubmit={handleSubmit} class="flex flex-col sm:flex-row gap-3">
                            <input 
                                type="text" 
                                value={message} 
                                onChange={(e) => setMessage(e.target.value)} 
                                placeholder="Add a new entry message..." 
                                required 
                                class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-md transition-colors shadow-sm">
                                Add Row
                            </button>
                        </form>
                        {status && <p class="mt-3 text-sm font-semibold text-blue-600">{status}</p>}
                    </div>

                    <div class="bg-white shadow-md rounded-lg p-6 border border-gray-100">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-semibold text-gray-800">Sheet Entries</h3>
                            <div class="flex gap-2">
                                <button 
                                    onClick={() => setViewMode("table")} 
                                    class={`px-3 py-1 text-xs font-semibold rounded ${viewMode === 'table' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                    Table View
                                </button>
                                <button 
                                    onClick={() => setViewMode("json")} 
                                    class={`px-3 py-1 text-xs font-semibold rounded ${viewMode === 'json' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}>
                                    Raw JSON
                                </button>
                            </div>
                        </div>

                        {loading ? (
                            <p class="text-gray-500 py-4">Loading data from Google Sheets...</p>
                        ) : rows.length === 0 ? (
                            <p class="text-gray-500 py-4">No data found in the eir_data tab.</p>
                        ) : viewMode === 'json' ? (
                            <pre class="bg-gray-900 text-green-400 p-4 rounded-md text-xs overflow-x-auto max-h-96">
                                {JSON.stringify(rows, null, 2)}
                            </pre>
                        ) : (
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-blue-50 text-blue-900 border-b border-gray-200">
                                            {headers.map((header, index) => (
                                                <th key={index} class="py-3 px-4 font-semibold text-sm">{header}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 text-sm">
                                        {dataRows.map((row, rowIndex) => (
                                            <tr key={rowIndex} class="hover:bg-gray-50 transition-colors">
                                                {row.map((cell, cellIndex) => (
                                                    <td key={cellIndex} class="py-3 px-4 text-gray-700">{cell}</td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
